name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project TetrPocket.xcodeproj \
            -target TetrPocket \
            -configuration Release \
            -sdk iphoneos \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/TetrPocket.app Payload/
          zip -r TetrPocket.ipa Payload
          ls -la TetrPocket.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetrPocket-ipa
          path: TetrPocket.ipa

      - name: Update "latest" release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TetrPocket (latest build)
          body: |
            Unsigned IPA built from commit ${{ github.sha }}.
            Sideload with Sideloadly or AltStore using your own Apple ID.
          files: TetrPocket.ipa
